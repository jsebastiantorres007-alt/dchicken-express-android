name: Compilar DChicken Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Instalar dependencias Android
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Instalar dependencias Capacitor
        run: npm install --no-audit --no-fund
      - name: Crear proyecto Android
        run: npx cap add android
      - name: Sincronizar proyecto Android
        run: npx cap sync android
      - name: Compilar APK de prueba
        working-directory: android
        run: bash ./gradlew assembleDebug --no-daemon
      - name: Guardar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: DChicken-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
